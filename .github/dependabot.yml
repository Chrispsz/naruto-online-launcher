version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Electron 11.5.0 is pinned for Flash PPAPI support (last version with PPAPI).
      # Upgrading requires migrating to Ruffle (Flash-in-WASM) — architectural change.
      - dependency-name: "electron"
      - dependency-name: "electron-builder"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
