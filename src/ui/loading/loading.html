<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carregando</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #ccc;
      }

      /* ── Background: radial gradient + particles ── */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(ellipse at 50% 45%, #0f0f18 0%, #0a0a0f 70%);
      }
      .bg-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255, 140, 0, 0.1);
        box-shadow: 0 0 8px rgba(255, 140, 0, 0.06);
        animation: particleDrift 12s ease-in-out infinite;
      }
      .particle:nth-child(1) {
        top: 18%;
        left: 22%;
        animation-delay: 0s;
        animation-duration: 14s;
      }
      .particle:nth-child(2) {
        top: 72%;
        left: 65%;
        animation-delay: -4s;
        animation-duration: 11s;
      }
      .particle:nth-child(3) {
        top: 35%;
        left: 80%;
        animation-delay: -7s;
        animation-duration: 16s;
      }

      /* ── Main wrapper ── */
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 24px;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      /* ── Shuriken icon with glow ── */
      .icon-area {
        position: relative;
        margin-bottom: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-glow {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(200, 162, 61, 0.12) 0%, transparent 70%);
        animation: iconGlow 3s ease-in-out infinite;
      }
      .shuriken {
        animation: shurikenSpin 20s linear infinite;
      }
      .shuriken svg {
        width: 72px;
        height: 72px;
        color: #c8a23d;
        filter: drop-shadow(0 0 12px rgba(200, 162, 61, 0.25));
      }
      .shuriken.error-state svg {
        color: #b34;
        filter: drop-shadow(0 0 12px rgba(187, 51, 68, 0.3));
        animation: none;
      }
      .shuriken.done-state svg {
        color: #10b981;
        filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.3));
        animation: none;
      }

      /* Phase-specific icons (overlaid on shuriken) */
      .phase-icon {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #1a1a2a;
        border: 2px solid #2a2a3a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.4s ease;
        opacity: 0;
        transform: scale(0.7);
      }
      .phase-icon.visible {
        opacity: 1;
        transform: scale(1);
      }
      .phase-icon svg {
        width: 14px;
        height: 14px;
      }
      .phase-icon.download-icon {
        border-color: rgba(200, 162, 61, 0.4);
      }
      .phase-icon.download-icon svg {
        fill: #c8a23d;
      }
      .phase-icon.extract-icon {
        border-color: rgba(200, 162, 61, 0.4);
      }
      .phase-icon.extract-icon svg {
        fill: #c8a23d;
      }
      .phase-icon.done-icon {
        border-color: rgba(16, 185, 129, 0.5);
        background: rgba(16, 185, 129, 0.1);
      }
      .phase-icon.done-icon svg {
        fill: #10b981;
      }
      .phase-icon.error-icon {
        border-color: rgba(187, 51, 68, 0.5);
        background: rgba(187, 51, 68, 0.1);
      }
      .phase-icon.error-icon svg {
        fill: #b34;
      }

      /* ── Title & subtitle ── */
      .title {
        font-size: 18px;
        font-weight: 700;
        color: #f0ede6;
        letter-spacing: -0.3px;
        margin-bottom: 8px;
        text-shadow: 0 0 20px rgba(200, 162, 61, 0.1);
        transition: opacity 0.3s ease;
        min-height: 24px;
      }
      .sub {
        font-size: 11.5px;
        color: #7a7a8e;
        margin-bottom: 36px;
        transition: opacity 0.3s ease;
        min-height: 16px;
      }

      /* ── Step indicator ── */
      .steps {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 28px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 0;
      }
      .step-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1.5px solid #2a2a3a;
        background: transparent;
        transition: all 0.4s ease;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .step-dot.active {
        border-color: #c8a23d;
        background: rgba(200, 162, 61, 0.2);
        box-shadow: 0 0 8px rgba(200, 162, 61, 0.3);
      }
      .step-dot.completed {
        border-color: #c8a23d;
        background: #c8a23d;
      }
      .step-dot.completed::after {
        content: '';
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #0a0a0f;
      }
      .step-label {
        font-size: 9px;
        color: #4a4a5e;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        transition: color 0.3s ease;
      }
      .step-dot.active .step-label {
        color: #c8a23d;
      }
      .step-dot.completed .step-label {
        color: #8b7230;
      }
      .step-line {
        width: 28px;
        height: 1.5px;
        background: #2a2a3a;
        margin: 0 2px;
        transition: background 0.4s ease;
        flex-shrink: 0;
      }
      .step-line.active {
        background: #c8a23d;
      }

      /* ── Progress bar ── */
      .bar-container {
        width: 300px;
        margin-bottom: 8px;
      }
      .bar {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        transition: box-shadow 0.4s ease;
      }
      .bar.active-download {
        box-shadow: 0 0 12px rgba(200, 162, 61, 0.15);
        animation: barPulse 2s ease-in-out infinite;
      }
      .bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #c8a23d, #e2c66d, #c8a23d);
        background-size: 200% 100%;
        transition: width 0.35s ease;
      }
      .bar.active-download .bar-fill {
        background: linear-gradient(
          90deg,
          #c8a23d 0%,
          #e2c66d 40%,
          #fff 50%,
          #e2c66d 60%,
          #c8a23d 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.8s ease-in-out infinite;
      }
      .bar.done .bar-fill {
        background: linear-gradient(90deg, #10b981, #34d399);
      }

      /* ── Percentage & detail line ── */
      .pct {
        font-size: 13px;
        color: #c8a23d;
        margin-top: 10px;
        font-variant-numeric: tabular-nums;
        min-height: 18px;
        font-weight: 600;
        transition: opacity 0.3s ease;
      }
      .detail {
        font-size: 10px;
        color: #5c5c6f;
        margin-top: 4px;
        min-height: 14px;
        transition: opacity 0.3s ease;
      }

      /* ── Error state ── */
      .err {
        color: #e04;
        max-width: 320px;
        line-height: 1.6;
        font-size: 12px;
        margin-top: 6px;
        font-weight: 500;
      }
      .retry-btn {
        margin-top: 16px;
        padding: 8px 24px;
        border-radius: 6px;
        border: 1.5px solid rgba(187, 51, 68, 0.4);
        background: rgba(187, 51, 68, 0.08);
        color: #e66;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        letter-spacing: 0.3px;
      }
      .retry-btn:hover {
        background: rgba(187, 51, 68, 0.15);
        border-color: rgba(187, 51, 68, 0.6);
        box-shadow: 0 0 12px rgba(187, 51, 68, 0.15);
      }
      .retry-btn:active {
        transform: scale(0.97);
      }

      /* ── Keyframes ── */
      @keyframes shurikenSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes iconGlow {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      @keyframes barPulse {
        0%,
        100% {
          box-shadow: 0 0 8px rgba(200, 162, 61, 0.1);
        }
        50% {
          box-shadow: 0 0 18px rgba(200, 162, 61, 0.25);
        }
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      @keyframes particleDrift {
        0%,
        100% {
          transform: translate(0, 0);
          opacity: 0.1;
        }
        25% {
          transform: translate(8px, -12px);
          opacity: 0.25;
        }
        50% {
          transform: translate(-4px, -6px);
          opacity: 0.1;
        }
        75% {
          transform: translate(12px, 8px);
          opacity: 0.2;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes fadeOut {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }

      /* Indeterminate shimmer (used before download % known) */
      .bar.indeterminate .bar-fill {
        width: 40% !important;
        animation: shimmer 1.4s ease-in-out infinite !important;
      }

      /* Hide elements as needed */
      .hidden {
        display: none !important;
      }

      /* Smooth text fade utility */
      .fade-text {
        transition: opacity 0.25s ease;
      }
    </style>
  </head>
  <body>
    <!-- Ambient background particles -->
    <div class="bg-particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <div class="wrap">
      <!-- Animated shuriken icon with glow -->
      <div class="icon-area">
        <div class="icon-glow"></div>
        <div class="shuriken" id="shurikenIcon">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M24 2L27 18Q24 20 24 20Q24 20 21 18Z" fill="currentColor" opacity=".7" />
            <path
              d="M24 2L27 18Q24 20 24 20Q24 20 21 18Z"
              fill="currentColor"
              opacity=".7"
              transform="rotate(90 24 24)"
            />
            <path
              d="M24 2L27 18Q24 20 24 20Q24 20 21 18Z"
              fill="currentColor"
              opacity=".7"
              transform="rotate(180 24 24)"
            />
            <path
              d="M24 2L27 18Q24 20 24 20Q24 20 21 18Z"
              fill="currentColor"
              opacity=".7"
              transform="rotate(270 24 24)"
            />
          </svg>
        </div>
        <!-- Phase-specific overlay icons -->
        <div class="phase-icon download-icon" id="phaseIconDownload">
          <svg viewBox="0 0 16 16">
            <path
              d="M8 1v9M4 7l4 4 4-4M2 13h12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="phase-icon extract-icon" id="phaseIconExtract">
          <svg viewBox="0 0 16 16">
            <path
              d="M3 10l2-6h6l2 6M5 10v3h6v-3M7 7h2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="phase-icon done-icon" id="phaseIconDone">
          <svg viewBox="0 0 16 16">
            <path
              d="M3.5 8.5l3 3 6-7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="phase-icon error-icon" id="phaseIconError">
          <svg viewBox="0 0 16 16">
            <path
              d="M4 4l8 8M12 4l-8 8"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </div>
      </div>

      <!-- Title & subtitle -->
      <div class="title fade-text" id="title">Naruto Online</div>
      <div class="sub fade-text" id="sub">Carregando servidor...</div>

      <!-- Step indicator -->
      <div class="steps" id="steps">
        <div class="step">
          <div class="step-dot active" id="step1"><span class="step-label">Conectando</span></div>
        </div>
        <div class="step-line" id="line1"></div>
        <div class="step">
          <div class="step-dot" id="step2"><span class="step-label">Baixando</span></div>
        </div>
        <div class="step-line" id="line2"></div>
        <div class="step">
          <div class="step-dot" id="step3"><span class="step-label">Extraindo</span></div>
        </div>
        <div class="step-line" id="line3"></div>
        <div class="step">
          <div class="step-dot" id="step4"><span class="step-label">Pronto</span></div>
        </div>
      </div>

      <!-- Progress bar -->
      <div class="bar-container">
        <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div></div>
      </div>
      <div class="pct fade-text" id="pct"></div>
      <div class="detail fade-text" id="detail"></div>

      <!-- Retry button (error state only) -->
      <button class="retry-btn hidden" id="retryBtn">Tentar novamente</button>
    </div>

    <script>
      // ── Element refs ──
      var bar = document.getElementById('bar');
      var fill = document.getElementById('barFill');
      var pct = document.getElementById('pct');
      var detail = document.getElementById('detail');
      var titleEl = document.getElementById('title');
      var subEl = document.getElementById('sub');
      var shuriken = document.getElementById('shurikenIcon');
      var retryBtn = document.getElementById('retryBtn');
      var phaseIcons = {
        download: document.getElementById('phaseIconDownload'),
        extract: document.getElementById('phaseIconExtract'),
        done: document.getElementById('phaseIconDone'),
        error: document.getElementById('phaseIconError')
      };

      var currentPhase = '';

      // ── Helper: fade text change ──
      function fadeText(el, text) {
        el.style.opacity = '0';
        setTimeout(function () {
          el.textContent = text;
          el.style.opacity = '1';
        }, 200);
      }

      // ── Helper: set step indicator state ──
      function setSteps(activeStep) {
        // activeStep: 1-4, or 0 for none
        for (var i = 1; i <= 4; i++) {
          var dot = document.getElementById('step' + i);
          dot.classList.remove('active', 'completed');
          if (i < activeStep) {
            dot.classList.add('completed');
          } else if (i === activeStep) {
            dot.classList.add('active');
          }
        }
        // Lines: active if the step before them is completed
        for (var j = 1; j <= 3; j++) {
          var line = document.getElementById('line' + j);
          line.classList.toggle('active', j < activeStep);
        }
      }

      // ── Helper: show phase icon ──
      function showPhaseIcon(phase) {
        Object.keys(phaseIcons).forEach(function (key) {
          phaseIcons[key].classList.remove('visible');
        });
        if (phaseIcons[phase]) {
          phaseIcons[phase].classList.add('visible');
        }
      }

      // ── Helper: reset icon state classes ──
      function resetIconState() {
        shuriken.classList.remove('error-state', 'done-state');
      }

      // ── Retry button handler ──
      retryBtn.addEventListener('click', function () {
        retryBtn.classList.add('hidden');
        resetIconState();
        bar.style.display = '';
        bar.classList.remove('done');
        bar.classList.add('indeterminate');
        setSteps(1);
        showPhaseIcon('');
        fadeText(titleEl, 'Naruto Online');
        fadeText(subEl, 'Conectando...');
        pct.style.color = '#c8a23d';
        pct.textContent = '';
        detail.textContent = '';
        window.setProgress(0, 'download', '');
      });

      // ── Main API: Called from main process via webContents.executeJavaScript ──
      // phase: 'download' | 'extract' | 'done' | 'error'
      window.setProgress = function (percent, phase, detailStr) {
        // Avoid redundant phase transitions
        var phaseChanged = phase !== currentPhase;
        currentPhase = phase;

        // Parse detail for speed/ETA (e.g. "12.3 MB / 45.0 MB  ·  2.1 MB/s  ·  ETA 16s")
        var speedText = '';
        var etaText = '';
        if (detailStr) {
          var parts = detailStr.split('·');
          for (var p = 0; p < parts.length; p++) {
            var trimmed = parts[p].trim();
            if (/MB\/s|KB\/s/.test(trimmed)) speedText = trimmed;
            if (/ETA/.test(trimmed)) etaText = trimmed.replace('ETA', '').trim();
          }
        }

        // ── Error phase ──
        if (phase === 'error') {
          shuriken.classList.add('error-state');
          fadeText(titleEl, 'Erro no download');
          fadeText(subEl, '');
          pct.innerHTML =
            '<span class="err">' + (detailStr || 'Falha ao baixar Flash PPAPI') + '</span>';
          detail.textContent = '';
          bar.style.display = 'none';
          bar.classList.remove('active-download', 'done');
          setSteps(0);
          showPhaseIcon('error');
          retryBtn.classList.remove('hidden');
          return;
        }

        // Hide retry for non-error phases
        retryBtn.classList.add('hidden');
        bar.style.display = '';

        // ── Download phase ──
        if (phase === 'download') {
          resetIconState();
          bar.classList.remove('done');

          if (phaseChanged) {
            fadeText(titleEl, 'Baixando Clean Flash PPAPI');
            fadeText(subEl, 'Primeira execução — plugin Flash está sendo baixado');
            showPhaseIcon('download');
          }

          if (percent > 0) {
            bar.classList.remove('indeterminate');
            bar.classList.add('active-download');
            fill.style.width = percent + '%';
            setSteps(2); // "Baixando" is step 2
            pct.style.color = '#c8a23d';
            pct.textContent = percent + '%';
            var detailParts = [];
            if (speedText) detailParts.push(speedText);
            if (etaText) detailParts.push('ETA ' + etaText);
            detail.textContent = detailParts.join('  ·  ');
          } else {
            bar.classList.add('indeterminate');
            bar.classList.remove('active-download');
            fill.style.width = '0%';
            setSteps(1); // "Conectando" is step 1
            pct.textContent = '';
            detail.textContent = 'Conectando...';
          }

          // ── Extract phase ──
        } else if (phase === 'extract') {
          resetIconState();
          bar.classList.remove('indeterminate', 'active-download');
          bar.classList.remove('done');

          if (phaseChanged) {
            fadeText(titleEl, 'Extraindo Flash PPAPI');
            fadeText(subEl, 'Instalando no cache local');
            showPhaseIcon('extract');
          }

          fill.style.width = '100%';
          setSteps(3); // "Extraindo" is step 3
          pct.style.color = '#c8a23d';
          pct.textContent = '';
          detail.textContent = 'Extraindo...';

          // ── Done phase ──
        } else if (phase === 'done') {
          shuriken.classList.add('done-state');
          bar.classList.remove('indeterminate', 'active-download');
          bar.classList.add('done');

          fadeText(titleEl, 'Flash pronto');
          fadeText(subEl, 'Reiniciando launcher...');
          showPhaseIcon('done');

          fill.style.width = '100%';
          setSteps(4); // "Pronto" is step 4
          pct.textContent = '✓';
          pct.style.color = '#10B981';
          detail.textContent = '';

          // ── Default/initial phase ──
        } else {
          resetIconState();
          bar.classList.add('indeterminate');
          bar.classList.remove('active-download', 'done');

          fadeText(titleEl, 'Naruto Online');
          fadeText(subEl, 'Carregando servidor...');
          showPhaseIcon('');

          fill.style.width = '0%';
          setSteps(1);
          pct.textContent = '';
          pct.style.color = '#c8a23d';
          detail.textContent = '';
        }
      };
    </script>
  </body>
</html>
